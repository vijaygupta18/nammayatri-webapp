<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Referral · NammaYatri Web</title>
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="assets/css/base.css" />
  <link rel="stylesheet" href="assets/css/components.css" />
  <link rel="stylesheet" href="assets/css/3d.css" />
  <link rel="stylesheet" href="assets/css/premium.css" />
  <link rel="stylesheet" href="assets/css/scenes.css" />
  <link rel="stylesheet" href="assets/css/futuristic.css" />
  <link rel="stylesheet" href="assets/css/mobile.css" />
  <meta name="theme-color" content="#FCC32C" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0A0B0F" media="(prefers-color-scheme: dark)" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
</head>
<body>
<div class="scene-bg" data-scene="handshake"></div>

<nav class="nav" data-nav></nav>

<main class="page scene-3d">
  <div class="grid-floor" aria-hidden="true"></div>

  <div class="wrap-md" style="margin-top: 40px;">
    <div class="cta-block cx-corners scan grain">
      <span class="brand-logo" aria-label="NammaYatri" style="margin-bottom: 20px;"></span><br/><span class="eyebrow">Bring a friend</span>
      <h1 style="margin-top: 10px;">Earn together.</h1>
      <p style="max-width: 52ch; margin: 10px auto 24px;">
        NammaYatri is zero-commission. Every new rider you bring keeps fares fair for drivers.
      </p>

      <div style="margin: 24px auto; max-width: 420px;">
        <div class="card">
          <div class="eyebrow" style="justify-content: center;">Your code</div>
          <div id="ref-code" class="mono" style="font-size: 44px; letter-spacing: 0.25em; color: var(--accent); margin: 14px 0; font-weight: 500;">—</div>
          <div class="row" style="gap: 8px; justify-content: center;">
            <button class="btn btn-primary" id="copy-btn">Copy</button>
            <button class="btn btn-ghost" id="share-btn">Share</button>
          </div>
        </div>
      </div>

      <div class="row" style="gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 18px;">
        <div class="chip chip-green">₹50 for them</div>
        <div class="chip chip-gold">₹50 for you</div>
        <div class="chip">After first ride</div>
      </div>
    </div>
  </div>
</main>

<script src="assets/js/config.js"></script>
<script src="assets/js/session.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/ui.js"></script>
<script src="assets/js/motion.js"></script>
<script src="assets/js/futuristic.js"></script>
<script>
(function () {
  'use strict';
  const { qs, toast } = NY_UI;
  NY_UI.renderNav('profile');
  if (!NY_SESSION.requireAuth()) return;

  const code = NY_SESSION.profile?.customerReferralCode || 'CSP2tz';
  qs('#ref-code').textContent = code;
  const link = `${location.origin}${location.pathname.replace('referral.html', 'login.html')}?ref=${code}`;

  qs('#copy-btn').addEventListener('click', async () => {
    try { await navigator.clipboard.writeText(code); toast('Code copied', { type: 'success' }); }
    catch { toast('Copy failed', { type: 'error' }); }
  });
  qs('#share-btn').addEventListener('click', async () => {
    const data = { title: 'Join NammaYatri', text: `Use my code ${code} on NammaYatri and we both earn ₹50!`, url: link };
    if (navigator.share) { try { await navigator.share(data); return; } catch {} }
    try { await navigator.clipboard.writeText(`${data.text} ${data.url}`); toast('Invite copied to clipboard', { type: 'success' }); }
    catch { toast(data.url, {}); }
  });
})();
</script>

<script src="https://unpkg.com/three@0.158.0/build/three.min.js"></script>
<script src="assets/js/scenes.js"></script>
</body>
</html>
