<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" role="img" aria-label="NammaYatri Web — animated hero banner">
  <title>NammaYatri · Web</title>
  <desc>Animated auto rickshaw driving through a Bengaluru-inspired cityscape, with the brand wordmark and a moving road.</desc>

  <defs>
    <!-- subtle sky glow behind the scene -->
    <radialGradient id="sky" cx="70%" cy="22%" r="55%">
      <stop offset="0%"   stop-color="#FCC32C" stop-opacity="0.25"/>
      <stop offset="45%"  stop-color="#FCC32C" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#FCC32C" stop-opacity="0"/>
    </radialGradient>
    <!-- road surface (perspective) — darker near, lighter far -->
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#181B22"/>
      <stop offset="100%" stop-color="#2B2F3A"/>
    </linearGradient>
    <!-- soft ground shadow under the rickshaw -->
    <radialGradient id="shadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"  stop-color="#000" stop-opacity="0.35"/>
      <stop offset="65%" stop-color="#000" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>

    <!-- reusable wheel with continuously spinning spokes -->
    <g id="wheel">
      <circle r="22" fill="#111317"/>
      <circle r="16" fill="#2B2E36"/>
      <g>
        <rect x="-1.4" y="-15" width="2.8" height="30" fill="#FCC32C"/>
        <rect x="-1.4" y="-15" width="2.8" height="30" fill="#FCC32C" transform="rotate(90)"/>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="0.55s" repeatCount="indefinite"/>
      </g>
      <circle r="5" fill="#D8DBE2"/>
    </g>

    <!-- tilted building (3D-feel) -->
    <g id="bldg">
      <polygon points="0,0 60,0 70,-12 10,-12" fill="#262A36"/>   <!-- top slab -->
      <rect x="0" y="0" width="60" height="80" fill="#1F2330"/>   <!-- front face -->
      <polygon points="60,0 70,-12 70,68 60,80" fill="#161923"/>  <!-- right face -->
    </g>
  </defs>

  <!-- sky -->
  <rect width="1200" height="260" fill="#0E1017"/>
  <rect width="1200" height="260" fill="url(#sky)"/>

  <!-- stars / distant lights -->
  <g fill="#FCC32C">
    <circle cx="120"  cy="48"  r="1.2" opacity="0.8"><animate attributeName="opacity" values="0.8;0.2;0.8" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="260"  cy="74"  r="1.4" opacity="0.6"><animate attributeName="opacity" values="0.6;0.2;0.6" dur="2.4s" begin="-1s" repeatCount="indefinite"/></circle>
    <circle cx="920"  cy="58"  r="1.2" opacity="0.7"><animate attributeName="opacity" values="0.7;0.15;0.7" dur="3.2s" begin="-0.6s" repeatCount="indefinite"/></circle>
    <circle cx="1080" cy="90"  r="1.6" opacity="0.9"><animate attributeName="opacity" values="0.9;0.3;0.9" dur="2.8s" begin="-1.4s" repeatCount="indefinite"/></circle>
    <circle cx="380"  cy="102" r="1"   opacity="0.5"><animate attributeName="opacity" values="0.5;0.1;0.5" dur="2s"   begin="-0.4s" repeatCount="indefinite"/></circle>
  </g>

  <!-- amber moon / brand sun -->
  <g transform="translate(970 110)">
    <circle r="46" fill="#FCC32C" opacity="0.1"/>
    <circle r="36" fill="#FCC32C" opacity="0.18"/>
    <circle r="26" fill="#FCC32C"/>
    <circle r="26" fill="#FCC32C" opacity="0.55">
      <animate attributeName="r" values="26;30;26" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.55;0.2;0.55" dur="5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- skyline (perspective, layered depth) -->
  <g>
    <use href="#bldg" transform="translate(60  220) scale(0.9)"/>
    <use href="#bldg" transform="translate(140 215) scale(1.05,1.15)"/>
    <use href="#bldg" transform="translate(230 210) scale(1.2,1.4)"/>
    <use href="#bldg" transform="translate(340 218) scale(0.95,1.1)"/>
    <use href="#bldg" transform="translate(430 214) scale(1.1,1.25)"/>
    <use href="#bldg" transform="translate(540 220) scale(0.85)"/>
    <use href="#bldg" transform="translate(640 210) scale(1.15,1.4)"/>
    <use href="#bldg" transform="translate(770 220) scale(0.9)"/>
    <use href="#bldg" transform="translate(870 216) scale(1.0,1.2)"/>
    <use href="#bldg" transform="translate(990 222) scale(0.8)"/>
    <use href="#bldg" transform="translate(1070 218) scale(1.0,1.1)"/>

    <!-- amber windows sprinkled on a few -->
    <g fill="#FCC32C">
      <rect x="250" y="200" width="3" height="5"/>
      <rect x="260" y="200" width="3" height="5"/>
      <rect x="270" y="200" width="3" height="5"/>
      <rect x="250" y="215" width="3" height="5"/>
      <rect x="270" y="215" width="3" height="5"/>
      <rect x="660" y="200" width="3" height="5"/>
      <rect x="670" y="200" width="3" height="5"/>
      <rect x="680" y="200" width="3" height="5"/>
      <rect x="660" y="215" width="3" height="5"/>
      <rect x="680" y="215" width="3" height="5"/>
      <rect x="660" y="230" width="3" height="5"/>
      <rect x="670" y="230" width="3" height="5"/>
    </g>
  </g>

  <!-- perspective road (trapezoid) -->
  <polygon points="0,400 1200,400 860,260 340,260" fill="url(#road)"/>
  <!-- far horizon edge highlight -->
  <line x1="340" y1="260" x2="860" y2="260" stroke="#FCC32C" stroke-width="1.2" opacity="0.45"/>

  <!-- yellow lane dashes (animate perspective scroll) -->
  <g>
    <polygon points="590,266 610,266 620,276 578,276" fill="#FCC32C">
      <animate attributeName="points" values="
        590,266 610,266 620,276 578,276;
        584,290 614,290 632,306 566,306;
        572,330 616,330 646,352 544,352;
        540,400 620,400 680,420 470,420;
        590,266 610,266 620,276 578,276
      " dur="1.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;1;1;0;0" keyTimes="0;0.1;0.7;0.95;1" dur="1.2s" repeatCount="indefinite"/>
    </polygon>
    <polygon points="590,266 610,266 620,276 578,276" fill="#FCC32C">
      <animate attributeName="points" values="
        590,266 610,266 620,276 578,276;
        584,290 614,290 632,306 566,306;
        572,330 616,330 646,352 544,352;
        540,400 620,400 680,420 470,420;
        590,266 610,266 620,276 578,276
      " dur="1.2s" begin="-0.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;1;1;0;0" keyTimes="0;0.1;0.7;0.95;1" dur="1.2s" begin="-0.6s" repeatCount="indefinite"/>
    </polygon>
  </g>

  <!-- curb highlights that recede -->
  <polygon points="0,400 340,260 330,260 -20,400" fill="#FCC32C" opacity="0.08"/>
  <polygon points="1200,400 860,260 870,260 1220,400" fill="#FCC32C" opacity="0.08"/>

  <!-- ============ WORDMARK + PROMISE (LEFT) ============ -->
  <g transform="translate(64 68)">
    <!-- small badge -->
    <rect x="0" y="0" width="150" height="24" rx="12" fill="#FCC32C"/>
    <text x="75" y="16.5" text-anchor="middle" font-family="'JetBrains Mono', Menlo, monospace" font-size="10.5" fill="#0F1115" letter-spacing="1.6">LIVE NETWORK · BLR</text>

    <!-- big display text -->
    <text x="0" y="80" font-family="'Space Grotesk', system-ui, sans-serif" font-weight="600" font-size="54" fill="#F5F5F7" letter-spacing="-1">
      NammaYatri<tspan fill="#FCC32C">.</tspan>web
    </text>

    <!-- subline (serif italic accent word) -->
    <text x="0" y="132" font-family="'Space Grotesk', system-ui, sans-serif" font-weight="400" font-size="24" fill="#B5B8BF" letter-spacing="-0.4">
      The ride you <tspan font-family="'Fraunces', Georgia, serif" font-style="italic" fill="#FCC32C">deserve</tspan>, open on the web.
    </text>

    <!-- feature chips -->
    <g font-family="'JetBrains Mono', Menlo, monospace" font-size="11" fill="#B5B8BF" letter-spacing="1.4">
      <g transform="translate(0 168)">
        <rect x="0" y="0" width="150" height="26" rx="4" fill="none" stroke="#343943" stroke-width="1"/>
        <circle cx="12" cy="13" r="3" fill="#FCC32C"/>
        <text x="22" y="17">0% COMMISSION</text>
      </g>
      <g transform="translate(160 168)">
        <rect x="0" y="0" width="120" height="26" rx="4" fill="none" stroke="#343943" stroke-width="1"/>
        <circle cx="12" cy="13" r="3" fill="#FCC32C"/>
        <text x="22" y="17">7 TIERS</text>
      </g>
      <g transform="translate(290 168)">
        <rect x="0" y="0" width="140" height="26" rx="4" fill="none" stroke="#343943" stroke-width="1"/>
        <circle cx="12" cy="13" r="3" fill="#FCC32C"/>
        <text x="22" y="17">LIVE TRACKING</text>
      </g>
    </g>
  </g>

  <!-- ground shadow under the rickshaw -->
  <ellipse cx="830" cy="370" rx="135" ry="10" fill="url(#shadow)"/>

  <!-- ============ AUTO RICKSHAW ============ -->
  <g transform="translate(830 310)">
   <g>
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 -3; 0 0" dur="0.45s" repeatCount="indefinite"/>

    <!-- tail plate -->
    <rect x="-112" y="-34" width="30" height="16" rx="2" fill="#FFD75C"/>
    <text x="-97" y="-22" text-anchor="middle" font-family="monospace" font-size="9" fill="#14161C">NY·01</text>

    <!-- exhaust puffs from the tail -->
    <g transform="translate(-110 -8)">
      <circle r="7" fill="#E7E9EE" opacity="0">
        <animate attributeName="opacity" values="0; 0.55; 0" dur="1.2s" repeatCount="indefinite"/>
        <animate attributeName="r"       values="6; 14; 18"  dur="1.2s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="translate" values="0 0; -36 -22" dur="1.2s" repeatCount="indefinite"/>
      </circle>
      <circle r="6" fill="#E7E9EE" opacity="0">
        <animate attributeName="opacity" values="0; 0.45; 0" dur="1.2s" begin="-0.4s" repeatCount="indefinite"/>
        <animate attributeName="r"       values="5; 12; 16"  dur="1.2s" begin="-0.4s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="translate" values="0 0; -30 -18" dur="1.2s" begin="-0.4s" repeatCount="indefinite"/>
      </circle>
      <circle r="5" fill="#E7E9EE" opacity="0">
        <animate attributeName="opacity" values="0; 0.5; 0"  dur="1.2s" begin="-0.8s" repeatCount="indefinite"/>
        <animate attributeName="r"       values="4; 10; 14"  dur="1.2s" begin="-0.8s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="translate" values="0 0; -40 -25" dur="1.2s" begin="-0.8s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- lower body -->
    <path d="
      M -100 -20
      Q -104 -50, -80 -54
      L -40 -60
      Q -10 -68, 30 -68
      L 60 -68
      Q 90 -68, 100 -42
      L 104 -18
      Q 106 -6, 96 0
      L -92 0
      Q -104 -2, -100 -20 Z
    " fill="#FCC32C"/>
    <!-- highlight -->
    <path d="M -80 -32 Q -20 -50, 70 -50 L 80 -48" fill="none" stroke="#FFE089" stroke-width="2" stroke-linecap="round"/>

    <!-- canopy -->
    <path d="M -60 -68 Q -60 -104, -20 -104 L 40 -104 Q 80 -104, 80 -74 L 80 -68 Z" fill="#14161C"/>
    <!-- amber stitch along the canopy -->
    <path d="M -58 -70 Q 0 -100, 78 -70" fill="none" stroke="#FCC32C" stroke-width="1.4" opacity="0.6"/>

    <!-- windshield tint -->
    <path d="M 46 -100 L 78 -70 L 78 -64 L 40 -64 Z" fill="#A9BECB" opacity="0.55"/>

    <!-- frame posts -->
    <path d="M -56 -66 L -56 -98 L -16 -98" fill="none" stroke="#14161C" stroke-width="1.5"/>
    <path d="M -12 -66 L -12 -98" fill="none" stroke="#14161C" stroke-width="1" opacity="0.5"/>
    <path d="M  20 -66 L  20 -98" fill="none" stroke="#14161C" stroke-width="1" opacity="0.5"/>

    <!-- driver + passengers -->
    <g fill="#14161C">
      <circle cx="30"  cy="-82" r="6"/>
      <path d="M 20 -76 Q 30 -66, 40 -76 L 40 -66 L 20 -66 Z"/>
      <circle cx="-20" cy="-82" r="5.5" opacity="0.85"/>
      <circle cx="-4"  cy="-82" r="5.5" opacity="0.65"/>
    </g>

    <!-- side rail -->
    <rect x="-60" y="-46" width="120" height="2" fill="#14161C"/>

    <!-- mirror -->
    <g transform="translate(60 -80)">
      <rect x="0" y="0" width="2" height="10" fill="#14161C"/>
      <circle cx="1" cy="-2" r="3" fill="#D8DBE2"/>
    </g>

    <!-- amber waist stripe -->
    <rect x="-96" y="-24" width="190" height="2.5" fill="#FCC32C"/>

    <!-- headlight + pulsing glow -->
    <circle cx="98"  cy="-18" r="4.5" fill="#FFAE00"/>
    <circle cx="98"  cy="-18" r="10"  fill="#FFAE00" opacity="0.35">
      <animate attributeName="r"       values="8;14;8"     dur="1.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.35;0.7;0.35" dur="1.6s" repeatCount="indefinite"/>
    </circle>

    <!-- forward light beam -->
    <path d="M 104 -18 L 165 -36 L 165 0 Z" fill="#FFAE00" opacity="0.18">
      <animate attributeName="opacity" values="0.15;0.3;0.15" dur="2.4s" repeatCount="indefinite"/>
    </path>

   </g>

   <!-- wheels (don't bounce — stay on road) -->
   <use href="#wheel" x="-70" y="20"/>
   <use href="#wheel" x="-28" y="20" opacity="0.95"/>
   <use href="#wheel" x="88"  y="20"/>
  </g>

  <!-- speed lines to the left of the rickshaw -->
  <g stroke="#FCC32C" stroke-linecap="round" opacity="0.7">
    <line x1="640" y1="300" x2="700" y2="300" stroke-width="2">
      <animate attributeName="x1" values="640; 540; 640" dur="0.8s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="700; 600; 700" dur="0.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0; 0.7; 0" dur="0.8s" repeatCount="indefinite"/>
    </line>
    <line x1="620" y1="325" x2="685" y2="325" stroke-width="1.6">
      <animate attributeName="x1" values="620; 520; 620" dur="0.8s" begin="-0.25s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="685; 585; 685" dur="0.8s" begin="-0.25s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0; 0.6; 0" dur="0.8s" begin="-0.25s" repeatCount="indefinite"/>
    </line>
    <line x1="660" y1="350" x2="715" y2="350" stroke-width="1.3">
      <animate attributeName="x1" values="660; 560; 660" dur="0.8s" begin="-0.5s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="715; 615; 715" dur="0.8s" begin="-0.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0; 0.55; 0" dur="0.8s" begin="-0.5s" repeatCount="indefinite"/>
    </line>
  </g>
</svg>
