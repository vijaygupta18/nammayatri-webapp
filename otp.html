<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Verify OTP · NammaYatri Web</title>
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="assets/css/base.css" />
  <link rel="stylesheet" href="assets/css/components.css" />
  <link rel="stylesheet" href="assets/css/3d.css" />
  <link rel="stylesheet" href="assets/css/premium.css" />
  <link rel="stylesheet" href="assets/css/scenes.css" />
</head>
<body>
<div class="scene-bg" data-scene="vault"></div>

<nav class="nav" data-nav></nav>

<main class="page scene-3d">
  <div class="grid-floor" aria-hidden="true"></div>

  <div class="wrap-sm" style="margin-top: 40px; text-align: center;">
    <span class="brand-logo" aria-label="NammaYatri" style="margin-bottom: 24px;"></span>
  </div>
  <div class="wrap-sm glass gradient-stroke" style="margin-top: 20px;">
    <span class="eyebrow">Step 2 of 2</span>
    <h1 style="margin: 10px 0 8px;">Verify OTP</h1>
    <p>Enter the 4-digit code sent to <b id="mask-mobile">…</b>.</p>

    <form id="otp-form" class="stack" style="--stack: 20px;" novalidate>
      <div class="otp-grid">
        <input class="otp-box" type="tel" maxlength="1" inputmode="numeric" autocomplete="one-time-code" aria-label="OTP digit 1" />
        <input class="otp-box" type="tel" maxlength="1" inputmode="numeric" aria-label="OTP digit 2" />
        <input class="otp-box" type="tel" maxlength="1" inputmode="numeric" aria-label="OTP digit 3" />
        <input class="otp-box" type="tel" maxlength="1" inputmode="numeric" aria-label="OTP digit 4" />
      </div>

      <div class="row-between">
        <a href="login.html" class="dim" style="font-size: 13px;">← Change number</a>
        <button type="button" id="resend-btn" class="btn btn-ghost btn-sm" disabled>Resend in <span id="resend-timer">30</span>s</button>
      </div>
      <div class="error-text hidden" id="otp-err"></div>

      <button class="btn btn-primary btn-block" type="submit" id="verify-btn">
        <span class="btn-label">Verify &amp; continue</span>
        <span class="btn-spinner hidden" aria-hidden="true"></span>
      </button>
    </form>
  </div>
</main>

<script src="assets/js/config.js"></script>
<script src="assets/js/session.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/ui.js"></script>
<script src="assets/js/motion.js"></script>
<script src="assets/js/otp.js"></script>

<script src="https://unpkg.com/three@0.161.0/build/three.min.js"></script>
<script src="assets/js/scenes.js"></script>
</body>
</html>
